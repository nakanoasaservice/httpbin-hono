name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    if: |
      github.event.action == 'labeled' && github.event.label.name == 'run-ci' ||
      github.event.pull_request.user.login != 'github-actions[bot]'

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true

      - name: Verify declared Node.js runtime
        run: node -e 'const expected = require("./package.json").devEngines.runtime.version; if (process.versions.node !== expected) throw new Error(`Expected Node ${expected}, got ${process.version}`)'

      - name: Run Check
        run: vp check

      - name: Run Tests
        run: vp test run
